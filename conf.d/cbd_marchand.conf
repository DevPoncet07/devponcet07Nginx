server {
    listen 80;
    server_name cbd-nature.devponcet07.fr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cbd-nature.devponcet07.fr;

    ssl_certificate     /etc/letsencrypt/live/devponcet07.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devponcet07.fr/privkey.pem;

    location / {
        proxy_pass http://cbd-nature:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name api.cbd-nature.devponcet07.fr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.cbd-nature.devponcet07.fr;

    ssl_certificate     /etc/letsencrypt/live/devponcet07.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devponcet07.fr/privkey.pem;

    location / {
        proxy_pass http://cbd-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}