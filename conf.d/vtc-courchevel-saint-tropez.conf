server {
    listen 80;
    server_name vtc-couchevel-saint-tropez.devponcet07.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vtc-couchevel-saint-tropez.devponcet07.fr;

    ssl_certificate /etc/letsencrypt/live/devponcet07.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devponcet07.fr/privkey.pem;
    
    location /api/ {
        proxy_pass http://vtc-couchevel-saint-tropez_api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://vtc-couchevel-saint-tropez_client:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
